<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="yt-local" content="__TOKEN__"><title>Organise channels</title><link rel="stylesheet" href="/app.css"><link rel="stylesheet" href="/organiser.css"><script src="/organiser.js" defer></script></head>
<body><header><div><h1>Organise channels</h1><p>Browse your subscriptions and assign them to topics.</p></div><a href="/">Playlist manager</a></header>
<div id="notice" role="status" aria-live="polite"></div>
<div id="preference-store" hidden><label id="single-topic-option" title="Saved for all channels. Choosing a new topic moves a channel from its current topic; existing overlaps stay until you untick them."><input id="single-topic" type="checkbox"> One topic per channel</label></div>
<main class="organiser-layout">
<aside class="panel"><h2>Topics</h2><div id="topic-filters"></div><details><summary>Create a topic</summary><form id="new-topic"><label>Topic name<input id="topic-name" required maxlength="120"></label><label><input id="topic-enabled" type="checkbox"> Enable automatic playlist updates</label><button type="submit">Create topic</button></form></details></aside>
<section class="panel"><h2>Channels</h2><label>Find a channel<input id="search" type="search" placeholder="Name or description"></label><label class="hide-assigned"><input id="hide-assigned" type="checkbox"> Hide categorised channels</label><p id="channel-count" class="muted"></p><div id="channels" class="channel-browser"></div></section>
<section class="panel channel-detail"><div id="detail"><p>Choose a channel to see its description and saved videos.</p></div></section>
</main></body></html>

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "youtube-playlist-builder"
version = "0.1.0"
description = "Build subject playlists from your own YouTube subscriptions."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "prompt-toolkit>=3.0,<4",
    "httpx>=0.28,<0.29",
    "pydantic>=2.11,<3",
    "google-api-python-client>=2.100,<3",
    "google-auth>=2.23,<3",
    "google-auth-oauthlib>=1.5,<2",
    "google-auth-httplib2>=0.2,<1",
]

[project.scripts]
yt-playlists = "youtube_playlist_builder.cli:main"

[tool.setuptools.packages.find]
where = ["src"]


[tool.setuptools.package-data]
"youtube_playlist_builder" = ["web_assets/*"]
"youtube_playlist_builder.vendor.iris" = ["LICENSE"]
